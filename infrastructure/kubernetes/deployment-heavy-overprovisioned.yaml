# Expected parser output (sanity check for unit tests):
#   source_type: kubernetes
#   application: api-backend
#   namespace: ecommerce
#   replicas: 8
#   cpu_request: 8
#   cpu_limit: 8
#   memory_request_gb: 16     # 16Gi
#   memory_limit_gb: 16       # 16Gi
#   autoscaling_enabled: false
#   container_image: ecommerce/api-backend:1.0.0
# Demo workload pairing: e-commerce, ~10,000 users, medium traffic

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend
  namespace: ecommerce
  labels:
    app: api-backend
    scenario: heavy-overprovisioned
spec:
  replicas: 8
  selector:
    matchLabels:
      app: api-backend
  template:
    metadata:
      labels:
        app: api-backend
    spec:
      containers:
        - name: api-backend
          image: ecommerce/api-backend:1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "8"
              memory: "16Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
# Expected parser output (sanity check for unit tests):
#   source_type: kubernetes
#   application: api-backend
#   namespace: ecommerce
#   replicas: 4
#   cpu_request: 2
#   cpu_limit: 4
#   memory_request_gb: 4      # 4Gi
#   memory_limit_gb: 8        # 8Gi
#   autoscaling_enabled: false
#   container_image: ecommerce/api-backend:1.0.0

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend
  namespace: ecommerce
  labels:
    app: api-backend
    scenario: moderate-overprovisioned
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api-backend
  template:
    metadata:
      labels:
        app: api-backend
    spec:
      containers:
        - name: api-backend
          image: ecommerce/api-backend:1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
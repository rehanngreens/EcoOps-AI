name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          pip install -r ml/requirements.txt

      - name: Enforce CI parity (no model artifacts in checkout)
        run: |
          if compgen -G "ml/models/*" > /dev/null; then
            echo "::error::ml/models/ must be empty in CI; the suite must pass without trained artifacts."
            exit 1
          fi
          echo "OK: no model artifacts present — CI-parity conditions hold."

      - name: Run backend tests (with coverage)
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          pytest -v \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage-backend.xml

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage-backend.xml
          if-no-files-found: error

  ml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          pip install -r ml/requirements.txt

      - name: Run ML preprocessing tests
        run: pytest -v ml/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend tests (with coverage)
        working-directory: frontend
        run: npm run test:coverage

      - name: Production build
        working-directory: frontend
        run: npm run build

  live-smoke:
    # The full end-to-end gate: train tiny real artifacts, boot the API,
    # and run every phase-by-phase check. Needs the manual Google trace,
    # so artifacts come from the deterministic synthetic generator instead;
    # this validates the PIPELINE, not model quality.
    needs: [backend, ml, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          pip install -r ml/requirements.txt

      - name: Train synthetic CI model artifacts
        run: python scripts/train_ci_artifacts.py --n-estimators 20

      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:////tmp/ecoops_smoke.sqlite3"
        run: alembic upgrade head

      - name: Start backend
        env:
          DATABASE_URL: "sqlite:////tmp/ecoops_smoke.sqlite3"
        run: |
          uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 \
            > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend is up (attempt $attempt)."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend did not become healthy in 30s"
          cat /tmp/uvicorn.log
          exit 1

      - name: Run phase-by-phase live verification
        run: python scripts/verify_all_phases.py

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/uvicorn.pid ]; then kill "$(cat /tmp/uvicorn.pid)" || true; fi

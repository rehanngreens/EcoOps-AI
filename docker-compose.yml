services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecoops
      POSTGRES_PASSWORD: ecoops
      POSTGRES_DB: ecoops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoops -d ecoops"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://ecoops:ecoops@postgres:5432/ecoops
      DEBUG: "true"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      MODEL_DIR: /models
    volumes:
      - ./ml/models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
